name: sos_artisan
description: Application SOS ARTISAN pour trouver des artisans au Burkina Faso.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0B1F3A"
    theme_color: "#0B1F3A"
